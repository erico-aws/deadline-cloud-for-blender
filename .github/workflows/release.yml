name: "Release"

on:
    workflow_dispatch:
        inputs:
            tag:
                required: true
                type: string

jobs:
    prerelease:
        uses: erico-aws/.github/.github/workflows/reusable_prerelease.yml@mainline
        secrets: inherit
        with:
            installer_oses: "['Linux', 'Windows', 'MacOS']"
            tag: ${{inputs.tag}}
    release:
        needs: prerelease
        uses: erico-aws/.github/.github/workflows/reusable_release.yml@mainline
        secrets: inherit
        with:
            tag: ${{inputs.tag}}
    publish:
        needs: release
        uses: erico-aws/.github/.github/workflows/reusable_publish_python.yml@mainline
        secrets: inherit
        with:
            tag: ${{inputs.tag}}
